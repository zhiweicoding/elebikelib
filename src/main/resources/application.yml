logging:
  config: classpath:logback-spring.xml
  level:
    root: info
    org.springframework: info
    xyz.zhiweicoding: debug

server:
  port: 8082

spring:
  aop:
    auto: true
    proxy-target-class: true
  application:
    name: elebike
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username:
    password:
    hikari:
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 60000
      login-timeout: 5
      max-lifetime: 60000
      maximum-pool-size: 10
      minimum-idle: 5
      read-only: false
  config:
    activate:
      on-profile: dev

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

cos:
  secretId:
  secretKey:
  region:
  bucket:
  baseUrl:

management:
  health:
    elasticsearch:
      enabled: false

qiniu:
  access-key: 6iK1pHSoJwh_vqAE-i6Oz4Hka-iQkotmeHzz3I7O
  secret-key: IvDlVcDa6KrqTewE1XfWknjqZGrCkm6GWxXypbul
  bucket: myloveqian
  domain: https://photo.myloveqian.cn
  prefix: article/
  expire: 7200

llm:
  provider: glm
  zhipu:
    api-key: ${LLM_ZHIPU_API_KEY:51f6e8362e0847c28254bc8170024a4e.w5sQL4N7qGVb6iLi}
    model: glm-4-flash-250414
  timeout-seconds: 30
  system-prompt: "You are a professional Arabic translator. Please translate the given English title and HTML body into Modern Standard Arabic. Strictly preserve all HTML tags and attributes, only translate visible text content. Keep links, code blocks, and placeholders unchanged. Output must be valid JSON with keys: title_ar, org_content_ar, content_ar. The content_ar should be a 2-3 sentence Arabic summary (approximately 200-280 characters) without HTML tags."
  auto-translate-on-write: false
